name: Deploy to Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  PROJECT_ID: iflow-robot
  REGION: europe-west1
  SERVICE_NAME: iso-backend

jobs:
  test:
    name: Run Full Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./app/backend
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run tests with coverage
        working-directory: ./app/backend
        run: |
          python -m pytest tests/ -v --cov=. --cov-report=term

      - name: Check test coverage
        working-directory: ./app/backend
        run: |
          python -m pytest --cov=. --cov-report=term --cov-fail-under=70

  deploy-backend:
    name: Deploy Backend to Cloud Run (Production)
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: production
      url: https://iso-backend-416751442341.europe-west1.run.app

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Deploy to Cloud Run
        working-directory: ./app/backend
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --timeout 60s \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars ENVIRONMENT=production,GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},FIREBASE_PROJECT_ID=${{ env.PROJECT_ID }},ENABLE_DEBUG_LOGIN=0,DEV_SKIP_OIDC=0,SCREENSHOT_STORAGE=firebase,LOG_LEVEL=INFO,CLOUD_RUN_BASE_URL=https://iso-backend-416751442341.europe-west1.run.app

      - name: Get service URL
        id: deploy
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Create deployment comment
        uses: actions/github-script@v7
        if: github.event_name == 'push'
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `✅ **Production Backend Deployed**\n\nBackend URL: ${url}\n\nEnvironment: Production\n\n⚠️ Run the credential migration script if needed:\n\`\`\`bash\npython app/backend/scripts/migrate_credentials.py --dry-run\n\`\`\``
            });

  deploy-frontend:
    name: Deploy Frontend to Firebase Hosting (Production)
    runs-on: ubuntu-latest
    needs: deploy-backend
    environment:
      name: production
      url: https://iflow-robot.web.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build with production config
        working-directory: ./web
        run: |
          cp .env.production .env.local
          npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: iflow-robot
          channelId: live
          target: hosting
          entryPoint: ./web

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version tag
        id: version
        run: |
          VERSION=v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          release_name: Production Release ${{ steps.version.outputs.tag }}
          body: |
            ## Deployment Summary

            **Backend:** https://iso-backend-416751442341.europe-west1.run.app
            **Frontend:** https://iflow-robot.web.app

            **Changes in this release:**
            ${{ github.event.head_commit.message }}

            Deployed from commit: ${{ github.sha }}
          draft: false
          prerelease: false
