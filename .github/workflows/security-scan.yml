name: Security Scan

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]
  schedule:
    # Run weekly on Sundays at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for comprehensive scan

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install detect-secrets
      run: pip install detect-secrets

    - name: Run secret detection
      continue-on-error: true
      run: |
        # Create baseline if it doesn't exist
        if [ ! -f .secrets.baseline ]; then
          detect-secrets scan > .secrets.baseline
        fi
        # Scan for secrets
        detect-secrets scan --baseline .secrets.baseline

    - name: Check for new secrets
      continue-on-error: true
      run: |
        # Compare with baseline
        detect-secrets scan | \
        detect-secrets-hook --baseline .secrets.baseline

  python-security:
    name: Python Security Check
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't block on security findings
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        cd app/backend
        pip install -r requirements.txt
        pip install bandit[toml]

    - name: Run Bandit security scan
      run: |
        cd app/backend
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . -f screen

    - name: Upload Bandit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bandit-security-report
        path: app/backend/bandit-report.json
        retention-days: 30

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Snyk Python scan
      continue-on-error: true
      uses: snyk/actions/python@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --file=app/backend/requirements.txt --severity-threshold=high

    - name: Run Snyk Node.js scan
      continue-on-error: true
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --file=web/package.json --severity-threshold=high

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    continue-on-error: true  # Optional since code scanning may not be enabled
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'javascript' ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
