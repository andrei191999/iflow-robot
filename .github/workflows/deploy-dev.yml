name: Deploy to Development

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  PROJECT_ID: iflow-robot
  REGION: europe-west1
  SERVICE_NAME: iso-backend-dev

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./app/backend
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run tests
        working-directory: ./app/backend
        run: |
          python -m pytest tests/ -v

  deploy-backend:
    name: Deploy Backend to Cloud Run (Dev)
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Deploy to Cloud Run
        working-directory: ./app/backend
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --timeout 60s \
            --set-env-vars ENVIRONMENT=development,GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},FIREBASE_PROJECT_ID=${{ env.PROJECT_ID }},ENABLE_DEBUG_LOGIN=0,DEV_SKIP_OIDC=0,CLOUD_RUN_BASE_URL=https://iso-backend-dev-416751442341.europe-west1.run.app,BASE_URL=https://iso-backend-dev-416751442341.europe-west1.run.app,SCREENSHOT_STORAGE=firebase,FIREBASE_STORAGE_BUCKET=iflow-robot.appspot.com

      - name: Get service URL
        id: deploy
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Comment deployment URL
        uses: actions/github-script@v7
        if: github.event_name == 'push'
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `✅ **Development Backend Deployed**\n\nBackend URL: ${url}\n\nEnvironment: Development`
            });

  deploy-frontend:
    name: Deploy Frontend to Firebase Hosting (Dev Channel)
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build with development config
        working-directory: ./web
        run: |
          echo "VITE_API_BASE_URL=https://iso-backend-dev-ioq56tobdq-ew.a.run.app" > .env.development
          echo "VITE_ENVIRONMENT=development" >> .env.development
          echo "VITE_FIREBASE_API_KEY=AIzaSyBdXhCOMR0Yzyn6qtrCRzk_D12psPN7c44" >> .env.development
          echo "VITE_FIREBASE_AUTH_DOMAIN=iflow-robot.firebaseapp.com" >> .env.development
          echo "VITE_FIREBASE_PROJECT_ID=iflow-robot" >> .env.development
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=416751442341" >> .env.development
          echo "VITE_FIREBASE_APP_ID=1:416751442341:web:3c5ad9c7f654bee019704c" >> .env.development
          cp .env.development .env.local
          npm run build

      - name: Deploy to Firebase Hosting Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: iflow-robot
          channelId: dev
          expires: 30d
          entryPoint: .
